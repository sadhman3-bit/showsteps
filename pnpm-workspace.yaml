packages:
  - packages/*
  - apps/*
  - fixtures/*

# Packages allowed to run install scripts: Electron downloads its runtime.
onlyBuiltDependencies:
  - electron
  - esbuild

# Build and test tools only (H8): fixed versions of packages that electron-builder and
# @electron/get pull in.
overrides:
  'undici@>=7 <7.30.1': ^7.30.1
  'undici@>=6 <6.29.1': ^6.29.1
  'fast-uri@<3.1.9': ^3.1.9

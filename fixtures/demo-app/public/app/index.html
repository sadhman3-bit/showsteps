<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledgerline</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <strong>Ledgerline</strong>
      <nav aria-label="Main">
        <a href="/app/" data-link>Dashboard</a>
        ·
        <a href="/app/invoices/new" data-link>New invoice</a>
        ·
        <a href="/reports.html">Reports</a>
      </nav>
      <span class="who" id="who" data-stable-id></span>
    </header>
    <main id="view" data-stable-id></main>

    <dialog id="review-dialog" data-stable-id aria-labelledby="review-heading">
      <h2 id="review-heading">Review invoice</h2>
      <dl id="review-summary"></dl>
      <p class="muted">Submitting sends this invoice for approval. This can't be undone.</p>
      <div style="display: flex; gap: 8px; justify-content: flex-end">
        <button type="button" id="review-back">Back to edit</button>
        <button type="button" class="danger" id="review-submit">Submit invoice</button>
      </div>
    </dialog>

    <script src="/config.js"></script>
    <script src="/scramble.js"></script>
    <script src="/components/approver-picker.js"></script>
    <script src="/app/app.js"></script>
  </body>
</html>
